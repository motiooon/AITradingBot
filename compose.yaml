services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    restart: unless-stopped
    init: true
    env_file: deploy/engine.env
    volumes:
      - paper-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  paper-data:
